<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elenco Risultati Quiz</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #0f766e;
            --warning: #b45309;
            --danger: #b91c1c;
            --border: #d1d5db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-block;
        }

        .btn-primary { background: var(--primary); color: #fff; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border-bottom: 1px solid var(--border);
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }

        th {
            color: var(--muted);
            font-size: 13px;
            text-transform: uppercase;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .link { font-weight: 600; text-decoration: none; }
        .link-show   { color: var(--primary); }
        .link-edit   { color: var(--warning); }
        .link-delete { color: var(--danger); }

        .empty { margin-top: 16px; color: var(--muted); }

        .score {
            font-weight: 700;
            color: var(--primary);
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments/Navabar :: navbar}"></nav>
<div class="container">
    <div class="header">
        <h1>Risultati Quiz</h1>
        <a class="btn btn-primary" th:href="@{/quizResult/add}">+ Nuovo risultato</a>
    </div>

    <table th:if="${results != null and !#lists.isEmpty(results)}">
        <thead>
        <tr>
            <th>Categoria</th>
            <th>Punteggio</th>
            <th>Corrette / Totale</th>
            <th>Data partita</th>
            <th>Azioni</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${results}">
            <td th:text="${r.category != null ? r.category.name : '-'}"></td>
            <td><span class="score" th:text="${r.score}"></span></td>
            <td th:text="${r.correctAnswer} + ' / ' + ${r.totalQuestions}"></td>
            <td th:text="${r.playedAt}"></td>
            <td>
                <div class="actions">
                    <a class="link link-show" th:href="@{/quizResult/{id}(id=${r.id})}">Dettaglio</a>
                    <a class="link link-edit" th:href="@{/quizResult/update/{id}(id=${r.id})}">Modifica</a>
                    <form th:action="@{/quizResult/delete/{id}(id=${r.id})}" method="post" style="display:inline">
                        <button type="submit" class="link link-delete"
                                style="background:none;border:none;cursor:pointer;padding:0;font-size:inherit;font-family:inherit">
                            Elimina
                        </button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <p class="empty" th:if="${results == null or #lists.isEmpty(results)}">Nessun risultato presente.</p>
</div>
</body>
</html>
