<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggiungi Risultato Quiz</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #0f766e;
            --danger: #b91c1c;
            --border: #d1d5db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 24px;
        }

        h1 { margin-bottom: 20px; }

        .field { margin-bottom: 16px; }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
        }

        .hint {
            margin-top: 4px;
            font-size: 13px;
            color: var(--muted);
        }

        .error {
            margin-top: 6px;
            color: var(--danger);
            font-size: 14px;
        }

        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-block;
        }

        .btn-primary  { background: var(--primary); color: #fff; }
        .btn-secondary { background: #e5e7eb; color: var(--text); }
    </style>
</head>
<body>
<nav th:replace="~{fragments/Navabar :: navbar}"></nav>
<div class="container">
    <h1>Nuovo Risultato Quiz</h1>

    <form th:action="@{/quizResult}" th:object="${result}" method="post">

        <div class="field">
            <label for="score">Punteggio</label>
            <input id="score" type="number" th:field="*{score}" placeholder="Es. 80">
            <p class="error" th:if="${#fields.hasErrors('score')}" th:errors="*{score}"></p>
        </div>

        <div class="field">
            <label for="totalQuestions">Totale domande</label>
            <input id="totalQuestions" type="number" th:field="*{totalQuestions}" placeholder="Es. 10">
            <p class="error" th:if="${#fields.hasErrors('totalQuestions')}" th:errors="*{totalQuestions}"></p>
        </div>

        <div class="field">
            <label for="correctAnswer">Risposte corrette</label>
            <input id="correctAnswer" type="number" th:field="*{correctAnswer}" placeholder="Es. 8">
            <p class="error" th:if="${#fields.hasErrors('correctAnswer')}" th:errors="*{correctAnswer}"></p>
        </div>

        <div class="field">
            <label for="playedAt">Data partita</label>
            <input id="playedAt" type="text" th:field="*{playedAt}" placeholder="Es. 2024-01-15T10:30:00Z">
            <p class="hint">Formato ISO 8601, es. 2024-01-15T10:30:00Z</p>
            <p class="error" th:if="${#fields.hasErrors('playedAt')}" th:errors="*{playedAt}"></p>
        </div>

        <div class="field">
            <label for="categoryId">ID Categoria</label>
            <input id="categoryId" type="number" th:field="*{category.id}" placeholder="ID della categoria">
        </div>

        <div class="actions">
            <button class="btn btn-primary" type="submit">Salva</button>
            <a class="btn btn-secondary" th:href="@{/quizResult}">Annulla</a>
        </div>
    </form>
</div>
</body>
</html>
