<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 - Richiesta non valida</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #0f766e;
            --warning: #b45309;
            --border: #d1d5db;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); color: var(--text); }
        .container {
            max-width: 600px;
            margin: 80px auto;
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 48px 40px;
            text-align: center;
        }
        .code { font-size: 80px; font-weight: 700; color: var(--warning); line-height: 1; margin-bottom: 16px; }
        .title { font-size: 22px; font-weight: 600; margin-bottom: 10px; }
        .message { color: var(--muted); font-size: 15px; margin-bottom: 32px; }
        .btn {
            background: var(--primary); color: #fff; border: none; border-radius: 8px;
            padding: 10px 24px; font-weight: 600; font-size: 14px;
            text-decoration: none; display: inline-block;
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments/Navabar :: navbar}"></nav>
<div class="container">
    <div class="code">400</div>
    <div class="title">Richiesta non valida</div>
    <div class="message" th:text="${message}">I dati inviati non sono corretti.</div>
    <a class="btn" th:href="@{/}">Torna alla home</a>
</div>
</body>
</html>
