<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elenco Domande</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #0f766e;
            --warning: #b45309;
            --danger: #b91c1c;
            --border: #d1d5db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);

        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-block;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border-bottom: 1px solid var(--border);
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }

        th {
            color: var(--muted);
            font-size: 13px;
            text-transform: uppercase;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .link {
            font-weight: 600;
            text-decoration: none;
        }

        .link-show { color: var(--primary); }
        .link-edit { color: var(--warning); }
        .link-delete { color: var(--danger); }

        .empty {
            margin-top: 16px;
            color: var(--muted);
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-easy   { background: #d1fae5; color: #065f46; }
        .badge-medium { background: #fef3c7; color: #92400e; }
        .badge-hard   { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/Navabar :: navbar}"></nav>
<div class="container">
    <div class="header">
        <h1>Domande</h1>
        <a class="btn btn-primary" th:href="@{/question/add}">+ Nuova domanda</a>
    </div>

    <table th:if="${question != null and !#lists.isEmpty(question)}">
        <thead>
        <tr>
            <th>Titolo</th>
            <th>Categoria</th>
            <th>Difficoltà</th>
            <th>Data creazione</th>
            <th>Azioni</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="q : ${question}">
            <td th:text="${q.title}"></td>
            <td th:text="${q.category != null ? q.category.name : '-'}"></td>
            <td><span class="badge"
                      th:classappend="${q.difficulty == 'facile'} ? 'badge-easy' : (${q.difficulty == 'medio'} ? 'badge-medium' : 'badge-hard')"
                      th:text="${q.difficulty}"></span></td>
            <td th:text="${q.creation}"></td>
            <td>
                <div class="actions">
                    <a class="link link-show" th:href="@{/question/{id}(id=${q.id})}">Dettaglio</a>
                    <a class="link link-edit" th:href="@{/question/update/{id}(id=${q.id})}">Modifica</a>
                    <form th:action="@{/question/delete/{id}(id=${q.id})}" method="post" style="display:inline">
                        <button type="submit" class="link link-delete"
                                style="background:none;border:none;cursor:pointer;padding:0;font-size:inherit;font-family:inherit">
                            Elimina
                        </button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <p class="empty" th:if="${question == null or #lists.isEmpty(question)}">Nessuna domanda presente.</p>
</div>
</body>
</html>
