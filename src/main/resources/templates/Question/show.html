<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettaglio Domanda</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #0f766e;
            --border: #d1d5db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 24px;
        }

        h1 { margin-bottom: 18px; }

        .row { margin-bottom: 16px; }

        .label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .value {
            font-size: 16px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-block;
        }

        .btn-primary  { background: var(--primary); color: #fff; }
        .btn-secondary { background: #e5e7eb; color: var(--text); }
    </style>
</head>
<body>
<nav th:replace="~{fragments/Navabar :: navbar}"></nav>
<div class="container">
    <h1>Dettaglio Domanda</h1>

    <div class="row">
        <span class="label">Titolo</span>
        <p class="value" th:text="${question.title}"></p>
    </div>

    <div class="options-grid">
        <div class="row">
            <span class="label">Opzione A</span>
            <p class="value" th:text="${question.optionA}"></p>
        </div>
        <div class="row">
            <span class="label">Opzione B</span>
            <p class="value" th:text="${question.optionB}"></p>
        </div>
        <div class="row">
            <span class="label">Opzione C</span>
            <p class="value" th:text="${question.optionC}"></p>
        </div>
        <div class="row">
            <span class="label">Opzione D</span>
            <p class="value" th:text="${question.optionD}"></p>
        </div>
    </div>

    <div class="row">
        <span class="label">Soluzione corretta</span>
        <p class="value" th:text="${question.solution}"></p>
    </div>

    <div class="row">
        <span class="label">Difficoltà</span>
        <p class="value" th:text="${question.difficulty}"></p>
    </div>

    <div class="row">
        <span class="label">Data creazione</span>
        <p class="value" th:text="${question.creation}"></p>
    </div>

    <div class="row">
        <span class="label">Categoria</span>
        <p class="value" th:text="${question.category != null ? question.category.name : '-'}"></p>
    </div>

    <div class="actions">
        <a class="btn btn-primary" th:href="@{/question/update/{id}(id=${question.id})}">Modifica</a>
        <a class="btn btn-secondary" th:href="@{/question}">Torna all'elenco</a>
    </div>
</div>
</body>
</html>
